<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="480" fill="#0f0f14"/>
  <text x="450" y="32" text-anchor="middle" fill="#e0e0f0" font-size="19" font-weight="700">
    Two ways to remember the past: appended cache vs. fixed-size overwrite
  </text>
  <text x="450" y="52" text-anchor="middle" fill="#666680" font-size="11">
    EDUCATIONAL INTERPRETATION — conceptual diagram, not a reproduction of any paper's figures
  </text>

  <!-- Left: standard KV cache -->
  <text x="220" y="90" text-anchor="middle" fill="#e0e0f0" font-size="15" font-weight="700">Standard KV cache (Transformer)</text>
  <text x="220" y="108" text-anchor="middle" fill="#666680" font-size="11">memory grows by one row per token, never overwritten</text>

  <g>
    <rect x="80" y="130" width="60" height="36" fill="#1a1a28" stroke="#2a2a3a"/>
    <rect x="140" y="130" width="60" height="36" fill="#1a1a28" stroke="#2a2a3a"/>
    <rect x="200" y="130" width="60" height="36" fill="#1a1a28" stroke="#2a2a3a"/>
    <rect x="260" y="130" width="60" height="36" fill="#1a1a28" stroke="#2a2a3a"/>
    <rect x="320" y="130" width="60" height="36" fill="#7b8cff" fill-opacity="0.25" stroke="#7b8cff"/>
    <text x="110" y="153" text-anchor="middle" fill="#aaaacc" font-size="11">K,V t=0</text>
    <text x="170" y="153" text-anchor="middle" fill="#aaaacc" font-size="11">K,V t=1</text>
    <text x="230" y="153" text-anchor="middle" fill="#aaaacc" font-size="11">K,V t=2</text>
    <text x="290" y="153" text-anchor="middle" fill="#aaaacc" font-size="11">K,V t=3</text>
    <text x="350" y="153" text-anchor="middle" fill="#7b8cff" font-size="11">K,V t=4</text>
  </g>
  <text x="220" y="195" text-anchor="middle" fill="#3dffa0" font-size="11">+ new column every step &#8594; memory &#8733; sequence length</text>

  <!-- growth over time schematic -->
  <g stroke="#2a2a3a">
    <line x1="80" y1="230" x2="380" y2="230"/>
  </g>
  <polyline points="80,230 380,150" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="230" y="245" text-anchor="middle" fill="#666680" font-size="10">cache size (linear growth, unbounded)</text>

  <!-- Right: BDH-style fixed state -->
  <text x="670" y="90" text-anchor="middle" fill="#e0e0f0" font-size="15" font-weight="700">Fixed-size associative state (BDH-inspired)</text>
  <text x="670" y="108" text-anchor="middle" fill="#666680" font-size="11">same slots reused every step; new writes overwrite old ones</text>

  <g>
    <rect x="560" y="130" width="220" height="36" fill="#1a1a28" stroke="#f5a623" stroke-width="1.5"/>
    <text x="670" y="153" text-anchor="middle" fill="#f5a623" font-size="11">M[n_heads, state_size, d_head] — constant size</text>
  </g>
  <text x="670" y="195" text-anchor="middle" fill="#f5a623" font-size="11">memory O(state_size), independent of sequence length</text>

  <g stroke="#2a2a3a">
    <line x1="560" y1="230" x2="780" y2="230"/>
  </g>
  <line x1="560" y1="200" x2="780" y2="200" stroke="#3dffa0" stroke-width="2.5"/>
  <text x="670" y="245" text-anchor="middle" fill="#666680" font-size="10">cache size (flat — never grows)</text>

  <!-- bottom explanation -->
  <rect x="60" y="300" width="780" height="150" rx="10" fill="#13131c" stroke="#2a2a3a"/>
  <text x="80" y="326" fill="#e0e0f0" font-size="13" font-weight="700">What changes, and what it costs</text>
  <text x="80" y="350" fill="#aaaacc" font-size="11">Left: every past token's exact Key/Value is retained. Failure mode under pressure &#8594; eviction (a specific token is gone).</text>
  <text x="80" y="372" fill="#aaaacc" font-size="11">Right: a fixed-size state array is written via a soft, decayed, similarity-weighted update every step. Failure mode &#8594;</text>
  <text x="80" y="392" fill="#aaaacc" font-size="11">interference (a new association partially overwrites an old one) — not eviction. No token is ever "the one that got dropped."</text>
  <text x="80" y="420" fill="#f5a623" font-size="11" font-weight="600">Honesty note: the right-hand box is CacheQuake's own toy layer (bdh_inspired_state.py), inspired by BDH's</text>
  <text x="80" y="438" fill="#f5a623" font-size="11" font-weight="600">
    published concept (arXiv:2509.26507) — a hand-designed write rule, NOT BDH's neuron-particle graph or learned synapses.
  </text>
</svg>
