<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b8cff"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#0f0f14"/>

  <text x="450" y="34" text-anchor="middle" fill="#e0e0f0" font-size="20" font-weight="700">
    CacheQuake — actual system architecture
  </text>
  <text x="450" y="56" text-anchor="middle" fill="#aaaacc" font-size="13">
    Learner's browser &#8594; frontend (React+Vite) &#8594; backend (FastAPI+PyTorch, CPU-only) &#8594; labeled precomputed data
  </text>

  <!-- Browser -->
  <rect x="40" y="100" width="180" height="70" rx="10" fill="#1a1a28" stroke="#2a2a3a"/>
  <text x="130" y="130" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="600">Learner's browser</text>
  <text x="130" y="150" text-anchor="middle" fill="#666680" font-size="11">renders the UI</text>

  <!-- Frontend -->
  <rect x="280" y="100" width="220" height="150" rx="10" fill="#13131c" stroke="#7b8cff" stroke-width="1.5"/>
  <text x="390" y="126" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="700">frontend/ (React 18 + Vite)</text>
  <text x="295" y="148" fill="#aaaacc" font-size="11">ControlPanel.jsx</text>
  <text x="295" y="166" fill="#aaaacc" font-size="11">CacheHeatmap.jsx</text>
  <text x="295" y="184" fill="#aaaacc" font-size="11">MemoryChart.jsx / AccuracyPanel.jsx</text>
  <text x="295" y="202" fill="#aaaacc" font-size="11">GuidedWalkthrough.jsx / Sandbox.jsx</text>
  <text x="295" y="220" fill="#aaaacc" font-size="11">BDHModule.jsx / PrecomputedBadge.jsx</text>
  <text x="295" y="238" fill="#666680" font-size="10">api/client.js — thin fetch wrapper, never mocks</text>

  <!-- Backend -->
  <rect x="560" y="100" width="220" height="150" rx="10" fill="#13131c" stroke="#3dffa0" stroke-width="1.5"/>
  <text x="670" y="126" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="700">backend/ (FastAPI + PyTorch)</text>
  <text x="575" y="148" fill="#aaaacc" font-size="11">app/main.py — /health, /simulate</text>
  <text x="575" y="166" fill="#aaaacc" font-size="11">app/model/ — ToyTransformer (4L, d64)</text>
  <text x="575" y="184" fill="#aaaacc" font-size="11">app/cache_policies/ — 4 policies</text>
  <text x="575" y="202" fill="#aaaacc" font-size="11">app/tasks/needle_haystack.py</text>
  <text x="575" y="220" fill="#aaaacc" font-size="11">app/simulation/runner.py</text>
  <text x="575" y="238" fill="#666680" font-size="10">all live compute — nothing here is faked</text>

  <!-- Data precomputed -->
  <rect x="560" y="300" width="220" height="110" rx="10" fill="#13131c" stroke="#f5a623" stroke-width="1.5"/>
  <text x="670" y="326" text-anchor="middle" fill="#e0e0f0" font-size="14" font-weight="700">data/precomputed/</text>
  <text x="575" y="350" fill="#aaaacc" font-size="11">accuracy_vs_budget.json</text>
  <text x="575" y="368" fill="#aaaacc" font-size="11">— LOCKED, our own sweep, all 4 policies</text>
  <text x="575" y="388" fill="#aaaacc" font-size="11">bdh_published_claims.json</text>
  <text x="575" y="404" fill="#666680" font-size="10">— BDH paper claims, "not reproduced by us"</text>

  <!-- Arrows -->
  <line x1="220" y1="135" x2="278" y2="135" stroke="#7b8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="249" y="122" text-anchor="middle" fill="#666680" font-size="10">renders</text>

  <line x1="500" y1="150" x2="558" y2="150" stroke="#7b8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="529" y="140" text-anchor="middle" fill="#666680" font-size="10">POST /simulate</text>
  <line x1="558" y1="185" x2="500" y2="185" stroke="#3dffa0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="529" y="200" text-anchor="middle" fill="#666680" font-size="10">per-step cache trace</text>

  <line x1="670" y1="250" x2="670" y2="298" stroke="#f5a623" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="278" fill="#666680" font-size="10">written once,</text>
  <text x="700" y="290" fill="#666680" font-size="10">by scripts/</text>

  <path d="M560,355 C 460,355 460,190 500,190" fill="none" stroke="#f5a623" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="420" y="270" fill="#666680" font-size="10">fetched directly by</text>
  <text x="420" y="284" fill="#666680" font-size="10">frontend for sweep views</text>
  <text x="420" y="298" fill="#666680" font-size="10">(labeled PRECOMPUTED)</text>

  <text x="450" y="450" text-anchor="middle" fill="#666680" font-size="10">
    Physical separation of data/precomputed/ from backend/app/ makes "live vs. precomputed" structural, not just a README claim.
  </text>
</svg>
