<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="520" fill="#0f0f14"/>
  <text x="450" y="34" text-anchor="middle" fill="#e0e0f0" font-size="20" font-weight="700">
    Retrieval accuracy vs. cache budget
  </text>
  <text x="450" y="56" text-anchor="middle" fill="#f5a623" font-size="12" font-weight="600">
    PRECOMPUTED — OUR RESULT (backend/data/precomputed/accuracy_vs_budget.json, LOCKED)
  </text>
  <text x="450" y="74" text-anchor="middle" fill="#666680" font-size="11">
    80 episodes/policy/budget, v3 checkpoint (5,000 training steps), needle-in-haystack, n_facts=3, seq_len=120
  </text>

  <!-- Axes -->
  <line x1="90" y1="440" x2="820" y2="440" stroke="#2a2a3a" stroke-width="1.5"/>
  <line x1="90" y1="120" x2="90" y2="440" stroke="#2a2a3a" stroke-width="1.5"/>
  <text x="455" y="475" text-anchor="middle" fill="#aaaacc" font-size="12">budget (tokens kept)</text>
  <text x="40" y="280" text-anchor="middle" fill="#aaaacc" font-size="12" transform="rotate(-90 40 280)">accuracy</text>

  <!-- Y gridlines 0,25,50,62.5% -->
  <g stroke="#1a1a28" stroke-width="1">
    <line x1="90" y1="440" x2="820" y2="440"/>
    <line x1="90" y1="360" x2="820" y2="360"/>
    <line x1="90" y1="280" x2="820" y2="280"/>
    <line x1="90" y1="200" x2="820" y2="200"/>
    <line x1="90" y1="120" x2="820" y2="120"/>
  </g>
  <text x="82" y="444" text-anchor="end" fill="#666680" font-size="10">0%</text>
  <text x="82" y="364" text-anchor="end" fill="#666680" font-size="10">20%</text>
  <text x="82" y="284" text-anchor="end" fill="#666680" font-size="10">40%</text>
  <text x="82" y="204" text-anchor="end" fill="#666680" font-size="10">60%</text>
  <text x="82" y="124" text-anchor="end" fill="#666680" font-size="10">80%</text>

  <!-- X ticks: 4, 8, 16, 32, 64, 96 -->
  <g fill="#666680" font-size="10" text-anchor="middle">
    <text x="150" y="458">4</text>
    <text x="270" y="458">8</text>
    <text x="390" y="458">16</text>
    <text x="510" y="458">32</text>
    <text x="630" y="458">64</text>
    <text x="750" y="458">96</text>
  </g>

  <!-- helper: y = 440 - accuracy*400 (accuracy in 0..0.8 mapped to 440..120, scale 400px/0.8=500) -->
  <!-- Using scale: y = 440 - acc*500 -->

  <!-- full_cache baseline (constant, dashed) accuracy 0.375 -->
  <line x1="90" y1="252.5" x2="820" y2="252.5" stroke="#7b8cff" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="825" y="257" fill="#7b8cff" font-size="11">full_cache (37.5%, unbounded baseline)</text>

  <!-- sliding_window: 4:.0625 8:.0625 16:.05 32:.075 64:.3 96:.2625 -->
  <polyline points="150,408.75 270,408.75 390,415 510,402.5 630,290 750,308.75"
            fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
  <g fill="#ff6b6b">
    <circle cx="150" cy="408.75" r="4"/><circle cx="270" cy="408.75" r="4"/>
    <circle cx="390" cy="415" r="4"/><circle cx="510" cy="402.5" r="4"/>
    <circle cx="630" cy="290" r="4"/><circle cx="750" cy="308.75" r="4"/>
  </g>

  <!-- heavy_hitter: 4:.0875 8:.0875 16:.025 32:.5125 64:.625 96:.3875 -->
  <polyline points="150,396.25 270,396.25 390,427.5 510,183.75 630,127.5 750,246.25"
            fill="none" stroke="#3dffa0" stroke-width="2.5"/>
  <g fill="#3dffa0">
    <circle cx="150" cy="396.25" r="4"/><circle cx="270" cy="396.25" r="4"/>
    <circle cx="390" cy="427.5" r="4"/><circle cx="510" cy="183.75" r="4"/>
    <circle cx="630" cy="127.5" r="4"/><circle cx="750" cy="246.25" r="4"/>
  </g>

  <!-- bdh_inspired_state: 4:.1375 8:.1375 16:.0875 32:.0875 64:.1375 96:.0625 -->
  <polyline points="150,371.25 270,371.25 390,396.25 510,396.25 630,371.25 750,408.75"
            fill="none" stroke="#f5a623" stroke-width="2.5"/>
  <g fill="#f5a623">
    <circle cx="150" cy="371.25" r="4"/><circle cx="270" cy="371.25" r="4"/>
    <circle cx="390" cy="396.25" r="4"/><circle cx="510" cy="396.25" r="4"/>
    <circle cx="630" cy="371.25" r="4"/><circle cx="750" cy="408.75" r="4"/>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <rect x="120" y="500" width="14" height="4" fill="#ff6b6b"/>
    <text x="140" y="506" fill="#e0e0f0">sliding_window</text>
    <rect x="290" y="500" width="14" height="4" fill="#3dffa0"/>
    <text x="310" y="506" fill="#e0e0f0">heavy_hitter</text>
    <rect x="450" y="500" width="14" height="4" fill="#f5a623"/>
    <text x="470" y="506" fill="#e0e0f0">bdh_inspired_state</text>
    <rect x="650" y="500" width="14" height="4" fill="#7b8cff"/>
    <text x="670" y="506" fill="#e0e0f0">full_cache (const.)</text>
  </g>
</svg>
